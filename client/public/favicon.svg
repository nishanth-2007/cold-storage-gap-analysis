<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="13" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" />

  <!-- Facility Warehouse Outline -->
  <g filter="url(#shadow)">
    <!-- Roof and Building Body -->
    <path d="M32 12L12 25.5H16V46.5C16 48 17.5 49 19 49H45C46.5 49 48 48 48 46.5V25.5H52L32 12Z" fill="url(#roofGrad)" />
    <!-- Interior Cold Chamber Arch -->
    <path d="M25 49V36C25 32.5 39 32.5 39 36V49H25Z" fill="#0369a1" />
  </g>

  <!-- Ice Crystal / Snowflake Motif in the Center -->
  <g stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
    <!-- Vertical and Horizontal Main Axes -->
    <line x1="32" y1="23" x2="32" y2="45" stroke="#ffffff" stroke-width="2.2" />
    <line x1="21" y1="34" x2="43" y2="34" stroke="#ffffff" stroke-width="2.2" />
    <!-- Diagonal Bars -->
    <line x1="24" y1="26" x2="40" y2="42" />
    <line x1="24" y1="42" x2="40" y2="26" />
    <!-- Snowflake Chevrons -->
    <path d="M30 25.5L32 23L34 25.5" stroke="#ffffff" />
    <path d="M30 42.5L32 45L34 42.5" stroke="#ffffff" />
    <path d="M23.5 32L21 34L23.5 36" stroke="#ffffff" />
    <path d="M40.5 32L43 34L40.5 36" stroke="#ffffff" />
  </g>

  <!-- Center Cold Glow Dot -->
  <circle cx="32" cy="34" r="2.5" fill="#38bdf8" />
  <circle cx="32" cy="34" r="1.2" fill="#ffffff" />

  <!-- Agricultural Fresh Sprout (Green leaf accent on roof corner) -->
  <path d="M44 14C44 14 49 12 51 16C51 20 46 20 44 18Z" fill="#86efac" />
  <path d="M44 18C44 18 43 14 47 13" stroke="#16a34a" stroke-width="0.8" stroke-linecap="round" />
</svg>